name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Validate documented release installer and metadata
        run: scripts/test-release-install.sh

  clean-machine-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - uses: Swatinem/rust-cache@v2
      - name: Install from a clean checkout
        run: cargo install --path . --locked --root "$RUNNER_TEMP/caboodle"
      - name: Prove the installed binary starts
        run: |
          export PATH="$RUNNER_TEMP/caboodle/bin:$PATH"
          caboodle --version
      - name: Run guided interview and retain the reviewed plan
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/caboodle/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/caboodle-phase2"
          cd "$RUNNER_TEMP/caboodle-phase2"
          printf '%s\n' \
            everything \
            'index repositories and answer code ownership questions' \
            0 \
            1 \
            'which fixture symbol is indexed?' \
            'one code symbol' \
            'the clean-machine fixture repository and its marker symbol' \
            'SELECT ?s WHERE { ?s ?p ?o }' \
            caboodle-verify-roundtrip \
            | caboodle init --guided | tee guided-interview.log
          test -s caboodle-plan.toml
          python3 - <<'PY'
          import tomllib
          with open("caboodle-plan.toml", "rb") as plan_file:
              plan = tomllib.load(plan_file)
          assert plan["profile"] == "everything"
          assert plan["tools"] == ["quipu", "camayoc", "bobbin", "yupana", "desire-path"]
          assert plan["intent"]["anticipated_questions"][0]["expected"] == "caboodle-verify-roundtrip"
          PY
      - name: Install and functionally verify the expanded corpus
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/caboodle/bin:$HOME/.cargo/bin:$PATH"
          cd "$RUNNER_TEMP/caboodle-phase2"
          caboodle install 2>&1 | tee first-install.log
          jq -e '
            .tools.quipu.verified == true and
            .tools.camayoc.verified == true and
            .tools.bobbin.verified == true and
            .tools.yupana.verified == true and
            .tools["desire-path"].verified == true
          ' .caboodle/state.json
      - name: Prove an interrupted apply can resume idempotently
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/caboodle/bin:$HOME/.cargo/bin:$PATH"
          cd "$RUNNER_TEMP/caboodle-phase2"
          caboodle install 2>&1 | tee resumed-install.log
          jq -e '[.tools[] | .applied and .verified] | all' .caboodle/state.json
          jq '{
            schema_version,
            tools,
            proof: {
              guided_plan: true,
              functional_install: true,
              idempotent_resume: true
            }
          }' .caboodle/state.json > proof.json
      - name: Render and validate reviewable observability artifacts
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/caboodle/bin:$HOME/.cargo/bin:$PATH"
          cd "$RUNNER_TEMP/caboodle-phase2"
          printf '%s\n' \
            '[targets]' \
            "quipu='127.0.0.1:8080'" \
            "bobbin='127.0.0.1:3030'" \
            > caboodle-observability.toml
          caboodle render-observability
          caboodle validate-observability
          jq -e '.contracts | length == 5' caboodle-observability/contracts.json
          grep -q 'quipu_graph_facts' caboodle-observability/alerts.yml
          grep -q 'bobbin_up' caboodle-observability/dashboard.json
      - name: Prove adversarial negative controls turn verification red
        run: |
          set -euo pipefail
          cargo test camayoc_verification_refuses_broken_control_retrieval_and_replay \
            -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/caboodle-phase2/adversarial-controls.log"
          cargo test expanded_adapter_negative_controls_turn_verification_red \
            -- --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/caboodle-phase2/adversarial-controls.log"
      - name: Retain the reviewed plan and proof record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caboodle-phase2-proof
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/caboodle-phase2/caboodle-plan.toml
            ${{ runner.temp }}/caboodle-phase2/.caboodle/state.json
            ${{ runner.temp }}/caboodle-phase2/proof.json
            ${{ runner.temp }}/caboodle-phase2/caboodle-observability/*
            ${{ runner.temp }}/caboodle-phase2/*.log
