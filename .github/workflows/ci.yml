name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  clean-machine-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CABOODLE_E2E_DIR: ${{ runner.temp }}/caboodle-phase1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install from a clean checkout
        run: cargo install --path . --locked --root "$RUNNER_TEMP/caboodle"
      - name: Prove the installed binary starts
        run: |
          export PATH="$RUNNER_TEMP/caboodle/bin:$PATH"
          caboodle --version
      - name: Run guided interview and retain the reviewed plan
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/caboodle/bin:$PATH"
          mkdir -p "$CABOODLE_E2E_DIR"
          cd "$CABOODLE_E2E_DIR"
          printf 'retrieval\n' | caboodle init --guided | tee guided-interview.log
          test -s caboodle-plan.toml
          python3 - <<'PY'
          import tomllib
          with open("caboodle-plan.toml", "rb") as plan_file:
              plan = tomllib.load(plan_file)
          assert plan["profile"] == "retrieval"
          assert plan["tools"] == ["quipu", "camayoc", "bobbin"]
          PY
      - name: Install and functionally verify the retrieval corpus
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/caboodle/bin:$HOME/.cargo/bin:$PATH"
          cd "$CABOODLE_E2E_DIR"
          caboodle install 2>&1 | tee first-install.log
          jq -e '
            .tools.quipu.verified == true and
            .tools.camayoc.verified == true and
            .tools.bobbin.verified == true
          ' .caboodle/state.json
      - name: Prove an interrupted apply can resume idempotently
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/caboodle/bin:$HOME/.cargo/bin:$PATH"
          cd "$CABOODLE_E2E_DIR"
          caboodle install 2>&1 | tee resumed-install.log
          jq -e '[.tools[] | .applied and .verified] | all' .caboodle/state.json
          jq '{
            schema_version,
            tools,
            proof: {
              guided_plan: true,
              functional_install: true,
              idempotent_resume: true
            }
          }' .caboodle/state.json > proof.json
      - name: Prove adversarial negative controls turn verification red
        run: |
          set -euo pipefail
          cargo test camayoc_verification_refuses_broken_control_retrieval_and_replay \
            -- --exact --nocapture 2>&1 | tee "$CABOODLE_E2E_DIR/adversarial-controls.log"
      - name: Retain the reviewed plan and proof record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caboodle-phase1-proof
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/caboodle-phase1/caboodle-plan.toml
            ${{ runner.temp }}/caboodle-phase1/.caboodle/state.json
            ${{ runner.temp }}/caboodle-phase1/proof.json
            ${{ runner.temp }}/caboodle-phase1/*.log
