name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  book-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/lychee"
          cd "$RUNNER_TEMP/lychee"
          gh release download lychee-v0.24.2 --repo lycheeverse/lychee \
            --pattern lychee-x86_64-unknown-linux-gnu.tar.gz \
            --pattern lychee-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum -c lychee-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar -xzf lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "$RUNNER_TEMP/lychee/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Build book and check links
        run: scripts/check-docs.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme-first-success:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-readme.sh
