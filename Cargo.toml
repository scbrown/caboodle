[package]
name = "tambo"
version = "0.4.0"
edition = "2021"
description = "Install and prove the whole AI knowledge-tool kit"
license = "MIT"
repository = "https://github.com/scbrown/tambo"
rust-version = "1.80"
# Tambo is the renamed installer. The legacy executable remains supported.
# Publication runs through the official release workflow after name/owner checks.
autobins = false
default-run = "tambo"

# Preserve the Rust import name while the command and package migrate.
[lib]
name = "caboodle"
path = "src/lib.rs"

[[bin]]
name = "tambo"
path = "src/main.rs"

[[bin]]
name = "caboodle"
path = "src/bin/caboodle.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4.3"
flate2 = "1.0"
tar = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[features]
# Compiles tests/fixtures/members/*.toml into the member registry beside the
# shipped members/*.toml. CI runs --all-features, so the CLI tests exercise a
# fixture member through the real binary; a release build never carries it.
fixture-members = []
