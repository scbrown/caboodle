[package]
name = "caboodle"
version = "0.1.0"
edition = "2021"
description = "Install and prove the whole AI knowledge-tool kit"
license = "MIT"
repository = "https://github.com/scbrown/caboodle"
rust-version = "1.80"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
