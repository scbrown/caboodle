# Test-only stack member (compiled in only with the fixture-members feature).
# Its release asset is the committed tests/fixtures/releases tarball, pinned here.
name = "fixture-demo"
kind = "rust-release"
repo = "caboodle-fixtures/fixture-demo"
version = "0.1.0"
tag = "v{version}"
asset = "fixture-demo-{tag}-{target}.tar.gz"
version_argv = ["--version"]
profiles = ["everything"]

[sha256]
x86_64-unknown-linux-gnu = "3a6bf0e8b149b8fed0e81d0f16ff61a15ef85dabeda91db9b01fecc61f28dbc6"

[[programs]]
name = "fixture-demo"
identity_argv = ["--version"]
identity_prefix = "fixture-demo "

[[verify]]
argv = ["fixture-demo", "list"]
absent = "{marker}"

[[verify]]
argv = ["fixture-demo", "add", "{marker}"]

[[verify]]
argv = ["fixture-demo", "list"]
present = "{marker}"
